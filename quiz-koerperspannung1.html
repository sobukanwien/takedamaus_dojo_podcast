<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Körperspannung-Quiz — Takedamaus Dojo Podcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17130f;
    --bg-soft: #1f1a15;
    --panel: #241f19;
    --panel-line: #3a3129;
    --paper: #ede3d3;
    --ink: #efe7da;
    --ink-muted: #a99a86;
    --red: #b3272d;
    --red-soft: #7d2024;
    --gold: #c9a24b;
    --ok: #6f9a5e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(179,39,45,0.08), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(201,162,75,0.06), transparent 45%);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 32px 16px 60px;
  }
  .stage{
    width: 100%;
    max-width: 480px;
  }
  header.top{
    text-align:center;
    margin-bottom: 26px;
  }
  .kanji-mark{
    font-family:'Shippori Mincho', serif;
    font-size: 15px;
    letter-spacing: 0.25em;
    color: var(--gold);
    margin-bottom: 6px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size: 26px;
    margin: 0 0 6px;
    line-height:1.3;
  }
  .subline{
    color: var(--ink-muted);
    font-size: 14px;
    margin:0;
  }
  .rule{
    width: 64px;
    height: 3px;
    background: var(--red);
    margin: 16px auto 0;
    border-radius: 2px;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    padding: 26px 22px;
    position: relative;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left: 22px; right: 22px;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:.5;
  }

  .step-title{
    font-family:'Shippori Mincho', serif;
    font-size: 18px;
    margin: 0 0 4px;
    color: var(--paper);
  }
  .step-hint{
    color: var(--ink-muted);
    font-size: 13px;
    margin: 0 0 18px;
  }

  .quiz-photo-wrap{
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--panel-line);
    margin-bottom: 20px;
    background: #000;
  }
  .quiz-photo-wrap img{
    width: 100%;
    display:block;
  }

  .option-list{
    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-bottom: 6px;
  }
  .option-btn{
    background: var(--bg-soft);
    border: 1px solid var(--panel-line);
    color: var(--ink);
    border-radius: 5px;
    padding: 13px 14px;
    font-size: 14.5px;
    font-family: inherit;
    text-align:left;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .option-btn:active{ transform: scale(0.98); }
  .option-btn:disabled{ cursor: default; }
  .option-btn.correct{
    border-color: var(--ok);
    color: var(--ok);
    background: rgba(111,154,94,0.1);
  }
  .option-btn.wrong{
    border-color: var(--red);
    color: var(--red-soft);
    background: rgba(179,39,45,0.08);
  }

  .feedback{
    font-size: 13.5px;
    text-align:center;
    min-height: 18px;
    margin: 14px 0 4px;
    color: var(--gold);
  }

  .btn{
    display:inline-block;
    width:100%;
    text-align:center;
    background: var(--red);
    color: var(--paper);
    border:none;
    border-radius: 5px;
    padding: 13px 16px;
    font-size: 14.5px;
    font-weight:500;
    cursor:pointer;
    font-family:'Zen Kaku Gothic New', sans-serif;
    transition: background .15s ease;
    margin-top: 12px;
  }
  .btn:hover{ background: var(--red-soft); }

  .result{
    text-align:center;
  }
  .result .big-kanji{
    font-family:'Shippori Mincho', serif;
    font-size: 40px;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .result p{
    color: var(--ink-muted);
    font-size: 14px;
    line-height:1.6;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <header class="top">
    <div class="kanji-mark">体幹</div>
    <h1>Körperspannung Aikido</h1>
    <p class="subline">Schau dir das Bild an und wähle die richtige Antwort</p>
    <div class="rule"></div>
  </header>

  <div class="card" id="card"></div>
</div>

<script>
(function(){

  const OPTIONS = [
    { id: 'ushiro-ukemi', label: 'Ushiro Ukemi' },
    { id: 'ushiro-kuzushi', label: 'Ushiro Kuzushi' },
    { id: 'oshi-ate', label: 'Oshi Ate' }
  ];
  const CORRECT_ID = 'oshi-ate';
  const PHOTO = 'oshi_ate.jpeg';

  const card = document.getElementById('card');
  let answered = false;

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderQuestion(){
    answered = false;
    const shuffled = shuffle(OPTIONS);
    card.innerHTML = `
      <p class="step-title">Welche Technik ist das?</p>
      <p class="step-hint">Sieh dir die Takeda Maus genau an und wähle eine Antwort.</p>
      <div class="quiz-photo-wrap">
        <img src="${PHOTO}" alt="Technik-Foto">
      </div>
      <div class="option-list" id="option-list"></div>
      <p class="feedback" id="feedback"></p>
    `;

    const list = document.getElementById('option-list');
    shuffled.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt.label;
      btn.dataset.id = opt.id;
      btn.onclick = () => selectAnswer(opt.id, btn);
      list.appendChild(btn);
    });
  }

  function selectAnswer(id, btn){
    if (answered) return;
    answered = true;

    const fb = document.getElementById('feedback');
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (id === CORRECT_ID){
      btn.classList.add('correct');
      fb.textContent = 'Richtig — das ist Oshi Ate!';
      fb.style.color = 'var(--ok)';
    } else {
      btn.classList.add('wrong');
      const correctBtn = Array.from(allBtns).find(b => b.dataset.id === CORRECT_ID);
      if (correctBtn) correctBtn.classList.add('correct');
      fb.textContent = 'Nicht ganz — richtig wäre Oshi Ate.';
      fb.style.color = 'var(--red)';
    }

    const retryBtn = document.createElement('button');
    retryBtn.className = 'btn';
    retryBtn.textContent = 'Nochmal versuchen';
    retryBtn.onclick = renderQuestion;
    card.appendChild(retryBtn);
  }

  renderQuestion();
})();
</script>

</body>
</html>
